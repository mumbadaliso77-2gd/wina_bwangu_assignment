
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Wina Bwangu</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Additional Dashboard Styles */
        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .transaction-form {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(76, 175, 80, 0.2);
        }

        .transaction-form h2 {
            color: #4CAF50;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            color: #fff;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .form-group input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .form-group select option {
            background: #1a1a2e;
            color: #fff;
        }

        .btn-submit {
            background: #4CAF50;
            color: #000;
            padding: 12px 40px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            font-size: 16px;
        }

        .btn-submit:hover {
            background: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(76, 175, 80, 0.4);
        }

        .result-display {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid rgba(76, 175, 80, 0.1);
        }

        .result-display h3 {
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .result-item span:first-child {
            opacity: 0.8;
        }

        .result-item span:last-child {
            font-weight: 600;
            color: #4CAF50;
        }

        .performance-bars {
            margin-top: 30px;
        }

        .bar-container {
            margin: 10px 0;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .bar-track {
            width: 100%;
            height: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 1s ease;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
        }

        .bar-fill.warning {
            background: linear-gradient(90deg, #FF9800, #FFC107);
        }

        .bar-fill.danger {
            background: linear-gradient(90deg, #f44336, #FF5722);
        }

        .cumulative-section {
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .cumulative-card {
            background: rgba(255,255,255,0.08);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(76, 175, 80, 0.1);
        }

        .cumulative-card h4 {
            color: #4CAF50;
            margin-bottom: 5px;
        }

        .cumulative-card .amount {
            font-size: 24px;
            font-weight: 700;
        }

        .cumulative-card .remaining {
            font-size: 14px;
            opacity: 0.8;
        }

        .cumulative-card .remaining.positive {
            color: #4CAF50;
        }

        .cumulative-card .remaining.negative {
            color: #f44336;
        }

        .transaction-history {
            margin-top: 30px;
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
        }

        .transaction-history h3 {
            color: #4CAF50;
            margin-bottom: 15px;
        }

        .transaction-history table {
            width: 100%;
            border-collapse: collapse;
            color: #fff;
            font-size: 14px;
        }

        .transaction-history th {
            background: rgba(76, 175, 80, 0.2);
            padding: 12px;
            text-align: left;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .transaction-history td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .transaction-history tr:hover {
            background: rgba(255,255,255,0.05);
        }

        .transaction-history::-webkit-scrollbar {
            width: 8px;
        }

        .transaction-history::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }

        .transaction-history::-webkit-scrollbar-thumb {
            background: #4CAF50;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .cumulative-section {
                grid-template-columns: 1fr 1fr;
            }
            .transaction-history table {
                font-size: 12px;
            }
            .transaction-history th,
            .transaction-history td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="nav-container">
            <div class="logo">
                <h2> Wina Bwangu</h2>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="dashboard.html" class="active">Dashboard</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <section class="dashboard-page">
        <div class="dashboard-overlay"></div>
        <div class="dashboard-container">
            <h1>Transaction Dashboard</h1>

            <!-- Transaction Form -->
            <div class="transaction-form">
                <h2> New Transaction</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>Transaction ID</label>
                        <input type="text" id="transactionId" readonly>
                    </div>
                    <div class="form-group">
                        <label>Mobile Booth</label>
                        <select id="mobileBooth">
                            <option value="">Select Booth</option>
                            <option value="Wina1">Wina1</option>
                            <option value="Wina2">Wina2</option>
                            <option value="Wina3">Wina3</option>
                            <option value="Wina4">Wina4</option>
                            <option value="Wina5">Wina5</option>
                            <option value="Wina6">Wina6</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Location</label>
                        <input type="text" id="location" readonly>
                    </div>
                    <div class="form-group">
                        <label>Service</label>
                        <select id="service">
                            <option value="">Select Service</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Revenue Per Kwacha</label>
                        <input type="text" id="revenueRate" readonly>
                    </div>
                    <div class="form-group">
                        <label>Transaction Amount (ZMW)</label>
                        <input type="number" id="transactionAmount" placeholder="Enter amount">
                    </div>
                </div>
                <button class="btn-submit" onclick="calculateTransaction()">Process Transaction</button>

                <div id="transactionResult" class="result-display" style="display:none;">
                    <h3>Transaction Summary</h3>
                    <div id="resultDetails"></div>
                </div>
            </div>

            <!-- Tax Performance Bars -->
            <div class="performance-bars">
                <h2 style="color:#4CAF50; margin-bottom:20px;"> Tax Performance</h2>
                <div id="taxBars"></div>
            </div>

            <!-- Cumulative Totals -->
            <div class="cumulative-section" id="cumulativeTotals">
                <h2 style="color:#4CAF50; grid-column: 1/-1; text-align:center; margin-bottom:10px;"> Cumulative Totals & Remaining Limits</h2>
                <div id="cumulativeCards"></div>
            </div>

            <!-- Transaction History -->
            <div class="transaction-history" id="transactionHistory">
                <h3> Recent Transactions</h3>
                <div id="historyTable"></div>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Wina Bwangu Online Booth. All rights reserved.</p>
    </footer>

    <script>
        // Data Definitions
        const boothLocations = {
            'Wina1': 'Lusaka CBD',
            'Wina2': 'Libala',
            'Wina3': 'Kabwata',
            'Wina4': 'Mandevu',
            'Wina5': 'Woodlands',
            'Wina6': 'Matero East'
        };

        const boothServices = {
            'Wina1': ['Airtel Money', 'MTN Money', 'Zamtel Money', 'Zanaco', 'FNB'],
            'Wina2': ['Airtel Money', 'MTN Money', 'Zamtel Money', 'FNB'],
            'Wina3': ['Airtel Money', 'MTN Money', 'Zamtel Money', 'Zanaco', 'FNB'],
            'Wina4': ['Airtel Money', 'MTN Money', 'Zamtel Money'],
            'Wina5': ['Airtel Money', 'MTN Money', 'Zanaco', 'FNB'],
            'Wina6': ['Airtel Money', 'MTN Money', 'Zamtel Money']
        };

        const serviceRevenue = {
            'Airtel Money': 0.05,
            'MTN Money': 0.06,
            'Zamtel Money': 0.045,
            'Zanaco': 0.035,
            'FNB': 0.04
        };

        const serviceLimits = {
            'Airtel Money': 350000,
            'MTN Money': 160000,
            'Zamtel Money': 70000,
            'Zanaco': 80000,
            'FNB': 80000
        };

        const serviceTaxRates = {
            'Airtel Money': 0.075,
            'MTN Money': 0.075,
            'Zamtel Money': 0.075,
            'Zanaco': 0.10,
            'FNB': 0.10
        };

        // Transaction counter
        let transactionCounter = 308;

        // Store transactions
        let transactions = [];

        // Initialize with sample data from Appendix
        function initializeTransactions() {
            const sampleData = [
                {id: 'WB0000001', booth: 'Wina1', service: 'Airtel Money', amount: 964},
                {id: 'WB0000002', booth: 'Wina1', service: 'MTN Money', amount: 220},
                {id: 'WB0000003', booth: 'Wina2', service: 'MTN Money', amount: 582},
                {id: 'WB0000004', booth: 'Wina3', service: 'Zamtel Money', amount: 349},
                {id: 'WB0000005', booth: 'Wina4', service: 'Airtel Money', amount: 328},
                {id: 'WB0000006', booth: 'Wina3', service: 'MTN Money', amount: 192},
                {id: 'WB0000007', booth: 'Wina3', service: 'Zanaco', amount: 1519},
                {id: 'WB0000008', booth: 'Wina4', service: 'Zamtel Money', amount: 1113},
                {id: 'WB0000009', booth: 'Wina1', service: 'FNB', amount: 1999},
                {id: 'WB0000010', booth: 'Wina3', service: 'Airtel Money', amount: 3810},
                {id: 'WB0000011', booth: 'Wina6', service: 'Zamtel Money', amount: 3270},
                {id: 'WB0000012', booth: 'Wina3', service: 'Zanaco', amount: 1092},
                {id: 'WB0000013', booth: 'Wina2', service: 'Airtel Money', amount: 1056},
                {id: 'WB0000014', booth: 'Wina3', service: 'Airtel Money', amount: 509},
                {id: 'WB0000015', booth: 'Wina5', service: 'FNB', amount: 34},
                {id: 'WB0000016', booth: 'Wina2', service: 'MTN Money', amount: 1658},
                {id: 'WB0000017', booth: 'Wina5', service: 'Zamtel Money', amount: 2167},
                {id: 'WB0000018', booth: 'Wina3', service: 'Airtel Money', amount: 2594},
                {id: 'WB0000019', booth: 'Wina4', service: 'Airtel Money', amount: 3656},
                {id: 'WB0000020', booth: 'Wina3', service: 'Airtel Money', amount: 4030}
            ];

            transactions = sampleData.map(t => ({
                ...t,
                revenue: t.amount * serviceRevenue[t.service],
                tax: t.amount * serviceTaxRates[t.service],
                afterTax: t.amount * (1 - serviceTaxRates[t.service])
            }));

            transactionCounter = 20;
        }

        // Generate Transaction ID
        function generateTransactionId() {
            transactionCounter++;
            return 'WB' + String(transactionCounter).padStart(7, '0');
        }

        // Auto-generate Transaction ID on page load
        document.addEventListener('DOMContentLoaded', function() {
            initializeTransactions();
            document.getElementById('transactionId').value = generateTransactionId();
            updateBoothServices();
            updateDisplay();
            updateCumulativeTotals();
            updateTaxBars();
            updateTransactionHistory();
        });

        // Update services based on booth selection
        function updateBoothServices() {
            const booth = document.getElementById('mobileBooth').value;
            const serviceSelect = document.getElementById('service');
            const locationInput = document.getElementById('location');

            // Clear existing options
            serviceSelect.innerHTML = '<option value="">Select Service</option>';

            if (booth && boothLocations[booth]) {
                locationInput.value = boothLocations[booth];
                const services = boothServices[booth] || [];
                services.forEach(service => {
                    const option = document.createElement('option');
                    option.value = service;
                    option.textContent = service;
                    serviceSelect.appendChild(option);
                });
                document.getElementById('revenueRate').value = '';
            } else {
                locationInput.value = '';
            }
        }

        // Update revenue rate when service is selected
        document.getElementById('service').addEventListener('change', function() {
            const service = this.value;
            if (service && serviceRevenue[service]) {
                document.getElementById('revenueRate').value = serviceRevenue[service];
            } else {
                document.getElementById('revenueRate').value = '';
            }
        });

        // Calculate Transaction
        function calculateTransaction() {
            const booth = document.getElementById('mobileBooth').value;
            const service = document.getElementById('service').value;
            const amount = parseFloat(document.getElementById('transactionAmount').value);

            if (!booth || !service || !amount || amount <= 0) {
                alert('Please fill in all fields with valid values.');
                return;
            }

            const revenueRate = serviceRevenue[service];
            const taxRate = serviceTaxRates[service];
            const revenue = amount * revenueRate;
            const tax = amount * taxRate;
            const afterTax = amount - tax;
            const transactionId = document.getElementById('transactionId').value;

            // Check cumulative limits
            const serviceTotal = transactions
                .filter(t => t.service === service)
                .reduce((sum, t) => sum + t.amount, 0);

            const limit = serviceLimits[service];
            const remaining = limit - serviceTotal;

            if (amount > remaining) {
                alert(` Insufficient credit for ${service}!\nRemaining: ZMW ${remaining.toFixed(2)}\nRequested: ZMW ${amount.toFixed(2)}`);
                return;
            }

            // Add transaction
            const newTransaction = {
                id: transactionId,
                booth: booth,
                location: boothLocations[booth],
                service: service,
                amount: amount,
                revenue: revenue,
                tax: tax,
                afterTax: afterTax,
                revenueRate: revenueRate
            };

            transactions.push(newTransaction);

            // Display result
            const resultDiv = document.getElementById('transactionResult');
            resultDiv.style.display = 'block';
            document.getElementById('resultDetails').innerHTML = `
                <div class="result-item"><span>Transaction ID</span><span>${transactionId}</span></div>
                <div class="result-item"><span>Mobile Booth</span><span>${booth}</span></div>
                <div class="result-item"><span>Location</span><span>${boothLocations[booth]}</span></div>
                <div class="result-item"><span>Service</span><span>${service}</span></div>
                <div class="result-item"><span>Revenue Per Kwacha</span><span>${revenueRate}</span></div>
                <div class="result-item"><span>Transaction Amount</span><span>ZMW ${amount.toFixed(2)}</span></div>
                <div class="result-item"><span>Revenue Generated</span><span>ZMW ${revenue.toFixed(2)}</span></div>
                <div class="result-item"><span>Tax (${(taxRate * 100).toFixed(1)}%)</span><span>ZMW ${tax.toFixed(2)}</span></div>
                <div class="result-item"><span>Amount After Tax</span><span>ZMW ${afterTax.toFixed(2)}</span></div>
                <div class="result-item"><span>Remaining Limit</span><span>ZMW ${(remaining - amount).toFixed(2)}</span></div>
            `;

            // Generate new Transaction ID
            document.getElementById('transactionId').value = generateTransactionId();
            document.getElementById('transactionAmount').value = '';

            // Update all displays
            updateDisplay();
            updateCumulativeTotals();
            updateTaxBars();
            updateTransactionHistory();

            // Scroll to result
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // Update cumulative totals
        function updateCumulativeTotals() {
            const container = document.getElementById('cumulativeCards');
            let html = '';

            Object.keys(serviceLimits).forEach(service => {
                const total = transactions
                    .filter(t => t.service === service)
                    .reduce((sum, t) => sum + t.amount, 0);
                const limit = serviceLimits[service];
                const remaining = limit - total;
                const isPositive = remaining >= 0;

                html += `
                    <div class="cumulative-card">
                        <h4>${service}</h4>
                        <div class="amount">ZMW ${total.toFixed(2)}</div>
                        <div style="font-size:12px; opacity:0.7;">Used of ZMW ${limit.toFixed(2)}</div>
                        <div class="remaining ${isPositive ? 'positive' : 'negative'}">
                            Remaining: ZMW ${remaining.toFixed(2)}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Update tax performance bars
        function updateTaxBars() {
            const container = document.getElementById('taxBars');
            let html = '';

            // Calculate tax per service
            const serviceTaxes = {};
            Object.keys(serviceTaxRates).forEach(service => {
                serviceTaxes[service] = transactions
                    .filter(t => t.service === service)
                    .reduce((sum, t) => sum + t.tax, 0);
            });

            const maxTax = Math.max(...Object.values(serviceTaxes), 1);

            Object.keys(serviceTaxes).forEach(service => {
                const taxAmount = serviceTaxes[service];
                const percentage = (taxAmount / maxTax) * 100;

                let barClass = 'bar-fill';
                if (percentage > 80) barClass += ' danger';
                else if (percentage > 50) barClass += ' warning';

                html += `
                    <div class="bar-container">
                        <div class="bar-label">
                            <span>${service}</span>
                            <span>ZMW ${taxAmount.toFixed(2)}</span>
                        </div>
                        <div class="bar-track">
                            <div class="${barClass}" style="width: ${percentage}%;"></div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Update transaction history
        function updateTransactionHistory() {
            const container = document.getElementById('historyTable');
            const recent = transactions.slice(-20).reverse();

            if (recent.length === 0) {
                container.innerHTML = '<p style="text-align:center; opacity:0.6;">No transactions yet.</p>';
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Booth</th>
                            <th>Service</th>
                            <th>Amount</th>
                            <th>Revenue</th>
                            <th>After Tax</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            recent.forEach(t => {
                html += `
                    <tr>
                        <td>${t.id}</td>
                        <td>${t.booth}</td>
                        <td>${t.service}</td>
                        <td>ZMW ${t.amount.toFixed(2)}</td>
                        <td>ZMW ${t.revenue.toFixed(2)}</td>
                        <td>ZMW ${t.afterTax.toFixed(2)}</td>
                    </tr>
                `;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        // Update overall display
        function updateDisplay() {
            // Could add more display updates here
        }

        // Add event listeners
        document.getElementById('mobileBooth').addEventListener('change', function() {
            updateBoothServices();
        });

        // Enter key to submit
        document.getElementById('transactionAmount').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                calculateTransaction();
            }
        });
    </script>
</body>
</html>
